      </ul>
    </div>
    <div class="powered"><svg><use href="#i-fox"/></svg><span data-i18n-html="powered"></span></div>
  </div>

  <div class="login-side">
    <div class="card">

        <h2 data-i18n="login_h"></h2>
        <p class="lead" data-i18n="login_lead"></p>
        <div class="saved-accounts" id="saved-accounts-box" hidden>

            <span class="saved-account-icon"><svg class="i"><use href="#i-lock"/></svg></span>
            <div><b data-i18n="saved_accounts_label"></b><small data-i18n="saved_accounts_hint"></small></div>
          </div>

            <select id="saved-accounts" data-i18n-aria="saved_accounts_label"></select>
            <button class="ghost" id="use-saved-account" type="button" data-i18n="use_saved_account"></button>
            <button class="ghost" id="remove-saved-account" type="button" data-i18n="remove_saved_account"></button>
          </div>
        </div>
        <label class="fld"><span data-i18n="email"></span>
          <div class="inp" dir="ltr"><svg class="i"><use href="#i-mail"/></svg><input id="email" type="email" dir="ltr" autocomplete="username" required placeholder="you@example.com"></div></label>
        <label class="fld"><span data-i18n="password"></span>
          <div class="inp" dir="ltr"><svg class="i"><use href="#i-lock"/></svg><input id="password" class="has-eye" type="password" dir="ltr" autocomplete="current-password" required>

          <label class="remember-account"><input id="remember-account" type="checkbox"><span data-i18n="remember_account"></span></label>
        <p class="err" id="err-login" role="alert"></p>
        <button class="btn" id="btn-login" type="submit"><span data-i18n="btn_login"></span></button>
      </form>

      <form id="f-code" hidden>
        <h2 data-i18n="code_h"></h2>
        <p class="lead" data-i18n="code_lead"></p>
        <label class="fld"><span data-i18n="code_label"></span>
          <div class="inp" dir="ltr"><svg class="i"><use href="#i-key"/></svg><input id="code" dir="ltr" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456"></div></label>
        <p class="err" id="err-code" role="alert"></p>
        <button class="btn" id="btn-code" type="submit"><span data-i18n="btn_code"></span></button>
        <button class="link" id="code-back" type="button" data-i18n="back"></button>
      </form>

      <div class="info">
        <div class="box spot"><div class="bi"><svg class="i"><use href="#i-clock"/></svg></div><div class="stat-copy"><small data-i18n="s_up"></small><b class="num" id="s-up">00:00:00</b></div></div>
        <div class="box spot"><div class="bi"><svg class="i"><use href="#i-upload"/></svg></div><div class="stat-copy"><small data-i18n="upload_rate"></small><b class="num" id="upload-rate">0 B/s</b></div></div>
        <div class="box spot"><div class="bi"><svg class="i"><use href="#i-download"/></svg></div><div class="stat-copy"><small data-i18n="download_rate"></small><b class="num" id="download-rate">0 B/s</b></div></div>
      </div>

      <section class="traffic-totals" aria-labelledby="traffic-total-title">
        <h3 id="traffic-total-title"><svg class="i"><use href="#i-layers"/></svg><span data-i18n="traffic_total_title"></span></h3>
        <div class="traffic-total-grid">
          <div class="traffic-total upload"><svg class="i"><use href="#i-upload"/></svg><span><span data-i18n="uploaded_total"></span><b class="num" id="uploaded-total">0 B</b></span></div>
          <div class="traffic-total"><svg class="i"><use href="#i-download"/></svg><span><span data-i18n="downloaded_total"></span><b class="num" id="downloaded-total">0 B</b></span></div>
        </div>
      </section>

      <section class="quota unknown" id="quota">
        <div class="quota-head"><h3 id="quota-title"><svg class="i"><use href="#i-layers"/></svg><span data-i18n="quota_title"></span></h3><b id="quota-value">—</b></div>
        <div class="quota-track" id="quota-bar" role="progressbar" aria-labelledby="quota-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="quota-fill" id="quota-fill"></span></div>
        <div class="quota-meta"><span id="quota-caption" data-i18n="quota_unknown"></span><span id="quota-total" data-i18n="quota_total_unknown"></span></div>
      </section>

      <section class="conn-settings" aria-labelledby="conn-title">
        <h3 id="conn-title"><svg class="i"><use href="#i-server"/></svg><span data-i18n="conn_title"></span></h3>
        <div class="mode-options" role="radiogroup" data-i18n-aria="conn_title">
          <label class="mode-card"><input type="radio" name="connection-mode" value="tun"><span><b data-i18n="mode_tun"></b><small data-i18n="mode_tun_desc"></small></span></label>
          <label class="mode-card"><input type="radio" name="connection-mode" value="system"><span><b data-i18n="mode_system"></b><small data-i18n="mode_system_desc"></small></span></label>
          <label class="mode-card"><input type="radio" name="connection-mode" value="manual"><span><b data-i18n="mode_manual"></b><small data-i18n="mode_manual_desc"></small></span></label>
        </div>
        <p class="conn-note" id="conn-note" aria-live="polite"></p>
        <div class="conn-fields" id="manual-fields">
          <label class="conn-field"><span data-i18n="proxy_protocol"></span><select id="manual-protocol"><option value="socks5">SOCKS5</option><option value="http">HTTP</option></select></label>
          <label class="conn-field"><span data-i18n="proxy_port"></span><input id="manual-port" type="number" min="1" max="65535" step="1" inputmode="numeric"></label>
        </div>
        <p class="conn-error" id="conn-error" role="alert"></p>
      </section>

      <div class="proxies off" id="proxies">
        <h3><svg class="i"><use href="#i-server"/></svg><span data-i18n="px_h"></span></h3>
        <div class="px"><span>SOCKS5</span><div class="pr"><code id="px-socks">127.0.0.1:10808</code><button class="chip" data-copy="px-socks" type="button"><svg class="i" style="width:14px;height:14px"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button></div></div>
        <div class="px"><span>HTTP / HTTPS</span><div class="pr"><code id="px-http">127.0.0.1:10809</code><button class="chip" data-copy="px-http" type="button"><svg class="i" style="width:14px;height:14px"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button></div></div>
        <p data-i18n="px_p"></p>
      </div>
    </div>

    <div class="dock">
      <button class="pick" id="pick" type="button" data-i18n-aria="pick_aria">
        <span id="pick-flag"></span>
        <span class="t"><small data-i18n="selected"></small><b id="pick-name">—</b></span>
        <svg class="i"><use href="#i-list"/></svg>
      </button>
      <div class="pingbox" aria-live="polite">
        <span class="sonar" id="sonar"></span>
        <div><div class="pv"><span class="num" id="pv">—</span><small>ms</small></div><div class="pq" id="pq"></div></div>
      </div>
      <button class="ghost" id="ping" type="button"><svg class="i"><use href="#i-pulse"/></svg><span data-i18n="ping_btn"></span></button>
    </div>
  </main>

  <section id="settings" hidden data-view="list" aria-labelledby="set-title">
    <div class="set-wrap">
      <div class="set-top">
        <button class="ghost" id="set-back" type="button"><svg class="i"><use href="#i-back"/></svg><span data-i18n="set_back"></span></button>
        <h2 id="set-title"></h2>
      </div>
      <div class="set-shell">
        <nav class="set-nav" role="tablist">
          <button type="button" role="tab" data-cat="general"><span class="bi"><svg class="i"><use href="#i-sliders"/></svg></span><span class="tx"><b data-i18n="set_cat_general"></b><small data-i18n="set_cat_general_d"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
          <button type="button" role="tab" data-cat="routing"><span class="bi"><svg class="i"><use href="#i-route"/></svg></span><span class="tx"><b data-i18n="set_cat_routing"></b><small data-i18n="set_cat_routing_d"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
          <button type="button" role="tab" data-cat="dns"><span class="bi"><svg class="i"><use href="#i-server"/></svg></span><span class="tx"><b data-i18n="set_cat_dns"></b><small data-i18n="set_cat_dns_d"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
          <button type="button" role="tab" data-cat="inbound"><span class="bi"><svg class="i"><use href="#i-inbound"/></svg></span><span class="tx"><b data-i18n="set_cat_inbound"></b><small data-i18n="set_cat_inbound_d"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
          <button type="button" role="tab" data-cat="about"><span class="bi"><svg class="i"><use href="#i-link"/></svg></span><span class="tx"><b data-i18n="set_cat_about"></b><small data-i18n="set_cat_about_d"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
        </nav>
        <div class="set-main">
          <h3 class="set-cat" id="set-cat-title"></h3>
          <p class="set-banner" id="set-tun-note" role="note" data-i18n="set_tun_only" hidden></p>
          <p class="set-banner" id="set-restart" role="status" data-i18n="set_restart" hidden></p>
          <div id="set-pane"></div>
        </div>
      </div>
    </div>
  </section>
</div>
